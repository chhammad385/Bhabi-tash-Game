services:
  - type: web
    name: bhabhi-api
    runtime: node
    plan: free
    region: oregon
    # --include=dev is required: vite/esbuild/typescript are devDependencies
    # and Render sets NODE_ENV=production, which would otherwise skip them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — never commit real values.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
